<meta charset="utf-8">
<title>Reporting Téléphonie Keyyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --ink:#1C2430; --muted:#6B7785; --line:#E3E8EF;
  --sort:#1A73E8; --entr:#13A8A0; --alert:#E8710A; --bad:#D93025; --good:#188038;
  --sidebar:#141B2B; --sidebar2:#1E283C; --sbtext:#A9B4C5; --sbactive:#2EE6C8;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* SIDEBAR */
.side{background:var(--sidebar);color:var(--sbtext);padding:0;display:flex;flex-direction:column}
.brand{padding:22px 20px 18px;border-bottom:1px solid #26324a}
.brand b{color:#fff;font-size:16px;font-weight:700;letter-spacing:.3px;display:block}
.brand span{font-size:11px;color:var(--sbactive);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.nav{padding:12px 10px;flex:1}
.nav button{width:100%;text-align:left;background:none;border:0;color:var(--sbtext);padding:11px 14px;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer;display:flex;gap:11px;align-items:center;margin-bottom:2px;transition:.15s}
.nav button:hover{background:var(--sidebar2);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(46,230,200,.16),transparent);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--sbactive)}
.nav .ic{width:18px;text-align:center;opacity:.9;font-size:15px}
.scope{padding:14px 18px;border-top:1px solid #26324a;font-size:11px;line-height:1.55;color:#7a8699}
.scope b{color:#cdd6e4;font-weight:600}
/* TOPBAR */
.main{display:flex;flex-direction:column;min-width:0}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;font-weight:600;flex:1;min-width:160px}
.flt{display:flex;gap:8px;align-items:center}
.flt label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.flt select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.reset{font:inherit;font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;color:var(--muted)}
.reset:hover{border-color:var(--sort);color:var(--sort)}
.wrap{padding:22px 26px 40px;overflow:auto}
.page{display:none;animation:fade .35s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* GRID + CARDS */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.kpi .val{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:600;margin-top:6px;letter-spacing:-.5px}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.accentS{box-shadow:inset 4px 0 0 var(--sort),var(--shadow)}
.kpi.accentE{box-shadow:inset 4px 0 0 var(--entr),var(--shadow)}
.kpi.accentA{box-shadow:inset 4px 0 0 var(--alert),var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:14px;font-weight:600}
.card .hint{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.cw{position:relative;height:260px}
.cw.sm{height:210px}
.cw.lg{height:320px}
canvas{max-width:100%}
@media(max-width:1050px){.g2,.g3{grid-template-columns:1fr}}
/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--sort)}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tag.s{background:#E8F0FE;color:#174ea6}.tag.e{background:#E0F5F3;color:#0b6e68}
.tag.ok{background:#E6F4EA;color:#137333}.tag.no{background:#FCE8E6;color:#a50e0e}
.scrollT{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.scrollT table th{position:sticky;top:0;background:#fff;z-index:2}
.search{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;margin-bottom:12px}
/* MATRIX */
.matrix td.num{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600}
.matrix tr.tot td{border-top:2px solid var(--ink);font-weight:700}
/* HEATMAP */
.heat{display:grid;gap:3px;font-size:10.5px}
.heat .hh{color:var(--muted);text-align:center;font-family:'IBM Plex Mono',monospace}
.heat .rl{color:var(--muted);font-weight:600;padding-right:6px;display:flex;align-items:center;justify-content:flex-end}
.hcell{aspect-ratio:1.6/1;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;cursor:default}
.note{background:#FFF8EC;border:1px solid #F5D9A8;border-left:4px solid var(--alert);border-radius:10px;padding:13px 16px;font-size:12.5px;color:#7a5418;line-height:1.55;margin-top:4px}
.note b{color:#5c3f12}
.insight{background:#EEF4FF;border:1px solid #C9DCFF;border-left:4px solid var(--sort);border-radius:10px;padding:13px 16px;font-size:12.5px;color:#1f3a66;line-height:1.55}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.bd{font-weight:600;color:var(--ink)}

.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;white-space:nowrap}
.live .dot{width:9px;height:9px;border-radius:50%;background:#bcc6d2;flex:none}
.live.ok .dot{background:var(--good);animation:pulse 2.2s infinite}
.live.err .dot{background:var(--bad)}
.live.load .dot{background:var(--alert)}
.live.warn .dot{background:var(--alert);animation:pulse 2.2s infinite}.live.warn{border-color:var(--alert)}
.empty-note{background:#FFF8EC;border:1px solid #F2C779;border-left:4px solid var(--alert);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:13px;color:#8a5a00;line-height:1.5}
.empty-note b{color:#7a4f00}.empty-note code{background:#fff;border:1px solid #eadbb0;border-radius:4px;padding:1px 5px;font-size:12px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,128,56,.45)}70%{box-shadow:0 0 0 6px rgba(24,128,56,0)}100%{box-shadow:0 0 0 0 rgba(24,128,56,0)}}
.live b{color:var(--ink);font-weight:600}
.iconbtn{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;color:var(--muted)}
.iconbtn:hover{border-color:var(--sort);color:var(--sort)}.iconbtn:disabled{opacity:.5;cursor:default}
#overlay{position:fixed;inset:0;background:rgba(244,246,249,.94);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(2px)}
#overlay .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px;box-shadow:var(--shadow);max-width:440px;text-align:center}
#overlay .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--sort);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay h2{margin:0 0 6px;font-size:16px}#overlay p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
#overlay.err .spin{display:none}#overlay .retry{margin-top:16px}
#toast{position:fixed;bottom:18px;right:18px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);font-size:12.5px;color:#7a1d18;max-width:360px;z-index:998;display:none}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span>Keyyo Phone</span><b>Reporting Téléphonie</b></div>
    <nav class="nav" id="nav">
      <button data-p="exec" class="on"><span class="ic">◆</span>Vue Exécutive</button>
      <button data-p="vol"><span class="ic">↕</span>Analyse des Volumes</button>
      <button data-p="time"><span class="ic">◷</span>Analyse Temporelle</button>
      <button data-p="site"><span class="ic">⌂</span>Analyse des Sites</button>
      <button data-p="corr"><span class="ic">⚇</span>Correspondants</button>
      <button data-p="dur"><span class="ic">⧗</span>Analyse des Durées</button>
      <button data-p="rate"><span class="ic">✓</span>Réussite des Appels</button>
      <button data-p="det"><span class="ic">≣</span>Détail des Appels</button>
    </nav>
    <div class="scope" id="scope"></div>
  </aside>

  <div class="main">
    <div class="top">
      <h1 id="ptitle">Vue Exécutive</h1>
      <div class="flt"><label>Période</label><select id="fMonth"></select></div>
      <div class="flt"><label>Site</label><select id="fSite"></select></div>
      <div class="flt"><label>Sens</label><select id="fNat">
        <option value="all">Tous</option><option value="1">Sortants</option><option value="0">Entrants</option>
      </select></div>
      <button class="reset" id="reset">Réinitialiser</button><button class="iconbtn" id="btnRefresh" title="Forcer une actualisation">⟳</button><div class="live load" id="liveBadge"><span class="dot"></span><span id="liveText">Connexion…</span></div>
    </div>
    <div class="wrap">
      <section class="page on" id="p-exec"></section>
      <section class="page" id="p-vol"></section>
      <section class="page" id="p-time"></section>
      <section class="page" id="p-site"></section>
      <section class="page" id="p-corr"></section>
      <section class="page" id="p-dur"></section>
      <section class="page" id="p-rate"></section>
      <section class="page" id="p-det"></section>
    </div>
  </div>
</div>

<div id="overlay"><div class="box"><div class="spin"></div>
  <h2 id="ovTitle">Connexion à Keyyo…</h2>
  <p id="ovMsg">Récupération des appels entrants et sortants en cours.</p>
  <button class="iconbtn retry" id="ovRetry" style="display:none">Réessayer</button></div></div>
<div id="toast"></div>

<script>
let R=[], M={};

const C = {ISO:0,HOUR:1,CALLER:2,CALLED:3,NAT:4,DUR:5,SITE:6,OK:7,CORR:8,WD:9,YM:10};
const COL = {sort:'#1A73E8', entr:'#13A8A0', alert:'#E8710A', good:'#188038', ink:'#1C2430', muted:'#6B7785', grid:'#EAEef3'};
const MONTHS_FR={'01':'janv.','02':'févr.','03':'mars','04':'avr.','05':'mai','06':'juin','07':'juil.','08':'août','09':'sept.','10':'oct.','11':'nov.','12':'déc.'};
const WD=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
Chart.defaults.font.family="'IBM Plex Sans',sans-serif";
Chart.defaults.font.size=12; Chart.defaults.color=COL.muted; Chart.defaults.plugins.legend.labels.boxWidth=12;

const state={month:'all',site:'all',nat:'all',page:'exec'};
const charts={};

// ---------- helpers ----------
const fmt=n=>n.toLocaleString('fr-FR');
const pct=(a,b)=>b?Math.round(a/b*1000)/10+' %':'– %';
// ---------- Contacts (rapprochement numéro -> nom) ----------
let CONTACTS={};
function normNum(s){
  if(s==null)return''; let x=String(s).replace(/[^\d+]/g,''); if(!x)return'';
  if(x.startsWith('00'))x='+'+x.slice(2);
  if(x[0]!=='+'){
    if(x.length===10&&x[0]==='0')x='+33'+x.slice(1);   // national FR -> E.164
    else x='+'+x;                                        // déjà international sans +
  }
  return x;
}
function nameOf(num){const k=normNum(num);return CONTACTS[k]||null;}
function escH(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function buildContactMap(data){
  const map={};
  if(Array.isArray(data)){
    for(const c of data){const nm=c.name||c.display||c.displayName||'';
      const nums=c.numbers||(c.number?[c.number]:[]); for(const n of nums){const k=normNum(n); if(k&&nm)map[k]=nm;}}
  } else if(data&&typeof data==='object'){
    for(const [k,v] of Object.entries(data)){const kk=normNum(k); if(kk&&typeof v==='string'&&v)map[kk]=v;}
  }
  return map;
}
async function loadContacts(){
  // 1) Synchro live Microsoft Graph
  try{
    const r=await fetch('/api/contacts',{cache:'no-store'});
    if(r.ok){const d=await r.json(); if(d&&!d.error){const m=buildContactMap(d); if(Object.keys(m).length){CONTACTS=m; return;}}}
  }catch(e){}
  // 2) Repli : fichier statique contacts.json
  try{
    const r=await fetch('/contacts.json',{cache:'no-store'}); if(!r.ok)return;
    CONTACTS=buildContactMap(await r.json());
  }catch(e){}
}
function mmss(s){if(s==null)return'';const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0');}
function median(arr){if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y),m=a.length>>1;return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2);}
function mlabel(ym){return MONTHS_FR[ym.slice(5)]+' '+ym.slice(2,4);}
function filtered(){return R.filter(r=>(state.month==='all'||r[C.YM]===state.month)&&(state.site==='all'||r[C.SITE]===state.site)&&(state.nat==='all'||r[C.NAT]==+state.nat));}
function mk(parent,html){const d=document.createElement('div');d.innerHTML=html;parent.innerHTML='';parent.appendChild(d);}
function newChart(id,cfg){if(charts[id])charts[id].destroy();const el=document.getElementById(id);if(el)charts[id]=new Chart(el,cfg);}
function kpi(lab,val,sub,cls){return `<div class="kpi ${cls||''}"><div class="lab">${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;}

// ---------- EXEC ----------
function renderExec(){
  const f=filtered();
  const ent=f.filter(r=>r[C.NAT]===0),sor=f.filter(r=>r[C.NAT]===1);
  const durTot=f.reduce((s,r)=>s+r[C.DUR],0);
  const okDur=f.filter(r=>r[C.DUR]>0).map(r=>r[C.DUR]);
  const ok=f.filter(r=>r[C.OK]).length;
  const html=`
  <div class="kpis">
    ${kpi('Appels',fmt(f.length),'sur la période filtrée')}
    ${kpi('Entrants',fmt(ent.length),pct(ent.length,f.length)+' du total','accentE')}
    ${kpi('Sortants',fmt(sor.length),pct(sor.length,f.length)+' du total','accentS')}
    ${kpi('Durée totale',(durTot/3600).toFixed(1)+' h',fmt(durTot)+' s cumulées')}
    ${kpi('Durée médiane',median(okDur)+' s','hors appels nuls')}
    ${kpi('Taux abouti',pct(ok,f.length),'durée > 0 (proxy)','accentA')}
  </div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card"><h3>Évolution mensuelle</h3><p class="hint">Volume d'appels entrants et sortants par mois</p><div class="cw"><canvas id="cExecLine"></canvas></div></div>
    <div class="card"><h3>Répartition par sens</h3><p class="hint">Part entrants / sortants</p><div class="cw"><canvas id="cExecDonut"></canvas></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Volume par site × sens</h3><p class="hint">Les deux lignes ont un usage opposé — comparer à sens égal</p><div class="cw sm"><canvas id="cExecSite"></canvas></div></div>
    <div class="card"><h3>Profil horaire</h3><p class="hint">Répartition des appels sur la journée</p><div class="cw sm"><canvas id="cExecHour"></canvas></div></div>
  </div>`;
  document.getElementById('p-exec').innerHTML=html;
  // monthly line
  const months=M.ym;
  const eM=months.map(m=>ent.filter(r=>r[C.YM]===m).length);
  const sM=months.map(m=>sor.filter(r=>r[C.YM]===m).length);
  newChart('cExecLine',{type:'line',data:{labels:months.map(mlabel),datasets:[
    {label:'Sortants',data:sM,borderColor:COL.sort,backgroundColor:COL.sort+'22',tension:.3,fill:true,borderWidth:2.5,pointRadius:3},
    {label:'Entrants',data:eM,borderColor:COL.entr,backgroundColor:COL.entr+'22',tension:.3,fill:true,borderWidth:2.5,pointRadius:3}]},
    options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:COL.grid}},x:{grid:{display:false}}},plugins:{legend:{position:'bottom'}}}});
  newChart('cExecDonut',{type:'doughnut',data:{labels:['Sortants','Entrants'],datasets:[{data:[sor.length,ent.length],backgroundColor:[COL.sort,COL.entr],borderWidth:0}]},
    options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}});
  // site x sens
  const sites=M.sites;
  const sS=sites.map(s=>f.filter(r=>r[C.SITE]===s&&r[C.NAT]===1).length);
  const sE=sites.map(s=>f.filter(r=>r[C.SITE]===s&&r[C.NAT]===0).length);
  newChart('cExecSite',{type:'bar',data:{labels:sites,datasets:[
    {label:'Sortants',data:sS,backgroundColor:COL.sort},{label:'Entrants',data:sE,backgroundColor:COL.entr}]},
    options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:{stacked:true,grid:{color:COL.grid}},y:{stacked:true,grid:{display:false}}},plugins:{legend:{position:'bottom'}}}});
  // hour
  const hrs=[...Array(14)].map((_,i)=>i+7);
  const hC=hrs.map(h=>f.filter(r=>r[C.HOUR]===h).length);
  newChart('cExecHour',{type:'bar',data:{labels:hrs.map(h=>h+'h'),datasets:[{data:hC,backgroundColor:COL.sort,borderRadius:3}]},
    options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:COL.grid}},x:{grid:{display:false}}},plugins:{legend:{display:false}}}});
}

// ---------- VOLUMES ----------
function renderVol(){
  const f=filtered();
  const ent=f.filter(r=>r[C.NAT]===0),sor=f.filter(r=>r[C.NAT]===1);
  const entMiss=ent.filter(r=>!r[C.OK]).length, sorMiss=sor.filter(r=>!r[C.OK]).length;
  document.getElementById('p-vol').innerHTML=`
  <div class="kpis">
    ${kpi('Appels',fmt(f.length))}
    ${kpi('% Entrants',pct(ent.length,f.length),'','accentE')}
    ${kpi('% Sortants',pct(sor.length,f.length),'','accentS')}
    ${kpi('Entrants non aboutis',fmt(entMiss),pct(entMiss,ent.length)+' des entrants','accentA')}
    ${kpi('Ratio E / S',sor.length?(ent.length/sor.length).toFixed(2):'–')}
  </div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card"><h3>Volume par mois × sens</h3><p class="hint">Barres groupées</p><div class="cw"><canvas id="cVolBar"></canvas></div></div>
    <div class="card"><h3>Matrice Site × Sens</h3><p class="hint">Le cœur de l'asymétrie</p>
      <table class="matrix"><thead><tr><th>Site</th><th class="num">Entrants</th><th class="num">Sortants</th><th class="num">Total</th></tr></thead><tbody id="volMx"></tbody></table>
    </div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Volume aboutis vs non aboutis</h3><p class="hint">Par sens — proxy via durée</p><div class="cw sm"><canvas id="cVolOk"></canvas></div></div>
    <div class="card"><h3>Volume par site</h3><div class="cw sm"><canvas id="cVolSite"></canvas></div></div>
  </div>`;
  const months=M.ym;
  newChart('cVolBar',{type:'bar',data:{labels:months.map(mlabel),datasets:[
    {label:'Sortants',data:months.map(m=>sor.filter(r=>r[C.YM]===m).length),backgroundColor:COL.sort},
    {label:'Entrants',data:months.map(m=>ent.filter(r=>r[C.YM]===m).length),backgroundColor:COL.entr}]},
    options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:COL.grid}},x:{grid:{display:false}}},plugins:{legend:{position:'bottom'}}}});
  // matrix
  let mx='';let tE=0,tS=0;
  M.sites.forEach(s=>{const e=f.filter(r=>r[C.SITE]===s&&r[C.NAT]===0).length,o=f.filter(r=>r[C.SITE]===s&&r[C.NAT]===1).length;tE+=e;tS+=o;
    mx+=`<tr><td class="bd">${s}</td><td class="num">${fmt(e)}</td><td class="num">${fmt(o)}</td><td class="num">${fmt(e+o)}</td></tr>`;});

// ---------- TEMPOREL ----------
function renderTime(){

  const peakH=hrs[hC.indexOf(Math.max(...hC))];
  // by weekday
  const wC=[0,1,2,3,4,5,6].map(w=>f.filter(r=>r[C.WD]===w).length);
  const peakW=WD[wC.indexOf(Math.max(...wC))];
  const days=[...new Set(f.map(r=>r[C.ISO]))];
  const we=f.filter(r=>r[C.WD]>=5).length;
  document.getElementById('p-time').innerHTML=`
  <div class="kpis">
    ${kpi('Heure de pic',peakH+'h',Math.max(...hC)+' appels')}
    ${kpi('Jour le + chargé',peakW)}
    ${kpi('Moy. / jour actif',days.length?Math.round(f.length/days.length):0,fmt(days.length)+' jours')}
    ${kpi('Activité week-end',pct(we,f.length),'','accentA')}
  </div>
  <div class="card" style="margin-bottom:16px"><h3>Carte de chaleur — Jour × Heure</h3><p class="hint">Intensité = nombre d'appels. Révèle les créneaux de pic et les creux.</p><div id="heat"></div>
   <div class="legend"><span>Moins</span><i style="background:#E0F5F3"></i><i style="background:#7FD4CC"></i><i style="background:#1A73E8;opacity:.6"></i><i style="background:#1A73E8"></i><span>Plus</span></div></div>
  <div class="grid g2">
    <div class="card"><h3>Volume par jour de semaine</h3><div class="cw sm"><canvas id="cTimeWd"></canvas></div></div>
    <div class="card"><h3>Profil horaire détaillé</h3><div class="cw sm"><canvas id="cTimeHour"></canvas></div></div>
  </div>`;
  // heatmap grid
  const hrange=[...Array(14)].map((_,i)=>i+7);
  let max=0;const grid={};
  [0,1,2,3,4,5,6].forEach(w=>{grid[w]={};hrange.forEach(h=>{const v=f.filter(r=>r[C.WD]===w&&r[C.HOUR]===h).length;grid[w][h]=v;if(v>max)max=v;});});
  let g='<div class="heat" style="grid-template-columns:38px repeat('+hrange.length+',1fr)">';

  [0,1,2,3,4,5,6].forEach(w=>{g+=`<div class="rl">${WD[w]}</div>`;hrange.forEach(h=>{const v=grid[w][h];const t=max?v/max:0;
    let bg;if(v===0)bg='#F4F6F9';else if(t<.25)bg='#E0F5F3';else if(t<.5)bg='#7FD4CC';else if(t<.75)bg='rgba(26,115,232,.6)';else bg='#1A73E8';
    g+=`<div class="hcell" style="background:${bg};color:${t>.4?'#fff':'#5a6470'}" title="${WD[w]} ${h}h : ${v} appels">${v||''}</div>`;});});
  g+='</div>';document.getElementById('heat').innerHTML=g;
  newChart('cTimeWd',{type:'bar',data:{labels:WD,datasets:[{data:wC,backgroundColor:COL.sort,borderRadius:4}]},
    options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:COL.grid}},x:{grid:{display:false}}},plugins:{legend:{display:false}}}});
  newChart('cTimeHour',{type:'line',data:{labels:hrs.map(h=>h+'h'),datasets:[{data:hC,borderColor:COL.entr,backgroundColor:COL.entr+'22',fill:true,tension:.35,borderWidth:2.5,pointRadius:2}]},
    options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:COL.grid}},x:{grid:{display:false}}},plugins:{legend:{display:false}}}});
}

// ---------- CORRESPONDANTS ----------
function renderCorr(){
  const f=filtered();
  function topN(field,n){const m={};f.forEach(r=>{m[r[field]]=(m[r[field]]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);}
  const called=topN(C.CALLED,10), callers=topN(C.CALLER,10);
  // pareto on correspondant
  const cm={};f.forEach(r=>{const k=r[C.CORR];if(!cm[k])cm[k]={n:0,d:0};cm[k].n++;cm[k].d+=r[C.DUR];});
  const arr=Object.entries(cm).sort((a,b)=>b[1].n-a[1].n);
  const top10share=arr.slice(0,10).reduce((s,x)=>s+x[1].n,0);
  const mask=k=>k.length>6?k.slice(0,4)+' ** ** '+k.slice(-2):k;
  // étiquette : nom du contact si connu, sinon numéro masqué
  const disp=k=>{const n=nameOf(k);return n?n:mask(k);};
  const cellCorr=k=>{const n=nameOf(k);return n
    ?`${escH(n)}<br><span style="font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace">${mask(k)}</span>`
    :`<span style="font-family:'IBM Plex Mono',monospace">${mask(k)}</span>`;};
  document.getElementById('p-corr').innerHTML=`
   <div class="kpis">
     ${kpi('Correspondants',fmt(arr.length),'numéros distincts')}
     ${kpi('% volume top 10',pct(top10share,f.length),'concentration','accentA')}
     ${kpi('Top correspondant',arr.length?disp(arr[0][0]):'–',arr.length?arr[0][1].n+' appels':'')}
   </div>
   <div class="grid g2" style="margin-bottom:16px">
     <div class="card"><h3>Top 10 numéros appelés</h3><div class="cw"><canvas id="cCalled"></canvas></div></div>
     <div class="card"><h3>Top 10 numéros appelants</h3><div class="cw"><canvas id="cCallers"></canvas></div></div>
   </div>
   <div class="card" style="margin-bottom:16px"><h3>Concentration (Pareto)</h3><p class="hint">% cumulé du volume par correspondant classé</p><div class="cw"><canvas id="cPareto"></canvas></div></div>
   <div class="card"><h3>Détail correspondants</h3><div class="scrollT" style="max-height:340px"><table>
     <thead><tr><th>Correspondant</th><th class="num">Appels</th><th class="num">Durée cumulée</th><th class="num">Durée médiane</th></tr></thead>
     <tbody>${arr.slice(0,40).map(([k,v])=>`<tr><td>${cellCorr(k)}</td><td class="num">${v.n}</td><td class="num">${(v.d/60).toFixed(0)} min</td><td class="num">${median(f.filter(r=>r[C.CORR]===k&&r[C.DUR]>0).map(r=>r[C.DUR]))} s</td></tr>`).join('')}</tbody></table></div></div>`;
  const barOpt=h=>({indexAxis:'y',maintainAspectRatio:false,scales:{x:{beginAtZero:true,grid:{color:COL.grid}},y:{grid:{display:false}}},plugins:{legend:{display:false}}});
  newChart('cCalled',{type:'bar',data:{labels:called.map(x=>disp(x[0])),datasets:[{data:called.map(x=>x[1]),backgroundColor:COL.sort,borderRadius:3}]},options:barOpt()});
  newChart('cCallers',{type:'bar',data:{labels:callers.map(x=>disp(x[0])),datasets:[{data:callers.map(x=>x[1]),backgroundColor:COL.entr,borderRadius:3}]},options:barOpt()});
  const top=arr.slice(0,25);let cum=0;const cumPct=top.map(x=>{cum+=x[1].n;return Math.round(cum/f.length*1000)/10;});
  newChart('cPareto',{data:{labels:top.map((x,i)=>i+1),datasets:[
    {type:'bar',label:'Appels',data:top.map(x=>x[1].n),backgroundColor:COL.sort+'cc',yAxisID:'y',borderRadius:2},
    {type:'line',label:'% cumulé',data:cumPct,borderColor:COL.alert,borderWidth:2.5,pointRadius:0,yAxisID:'y1',tension:.2}]},
    options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,position:'left',grid:{color:COL.grid}},y1:{beginAtZero:true,max:100,position:'right',grid:{display:false},ticks:{callback:v=>v+'%'}},x:{grid:{display:false},title:{display:true,text:'correspondants classés'}}},plugins:{legend:{position:'bottom'}}}});
}

    options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:COL.grid},title:{display:true,text:'secondes'}},x:{grid:{display:false}}},plugins:{legend:{display:false}}}});

// ---------- DÉTAIL ----------
let detSort={k:0,dir:-1},detSearch='';
function renderDet(){
  const f=filtered();
  document.getElementById('p-det').innerHTML=`
   <div class="card">
     <input class="search" id="detSearch" placeholder="🔍 Rechercher un numéro (appelant ou appelé)…" value="${detSearch}">
     <p class="hint" id="detCount"></p>
     <div class="scrollT"><table id="detTable">
       <thead><tr>
         <th data-k="0">Date</th><th data-k="1">Heure</th><th data-k="2">Appelant</th><th data-k="3">Appelé</th>
         <th data-k="4">Sens</th><th data-k="6">Site</th><th class="num" data-k="5">Durée</th><th data-k="7">Abouti</th>
       </tr></thead><tbody id="detBody"></tbody></table></div>
   </div>`;
  document.getElementById('detSearch').addEventListener('input',e=>{detSearch=e.target.value;fillDet();});
  document.querySelectorAll('#detTable th').forEach(th=>th.addEventListener('click',()=>{const k=+th.dataset.k;detSort.dir=detSort.k===k?-detSort.dir:1;detSort.k=k;fillDet();}));
  fillDet();
}
function fillDet(){
  let f=filtered();
  if(detSearch.trim()){const q=detSearch.trim().toLowerCase();f=f.filter(r=>r[C.CALLER].toLowerCase().includes(q)||r[C.CALLED].toLowerCase().includes(q)||(nameOf(r[C.CALLER])||'').toLowerCase().includes(q)||(nameOf(r[C.CALLED])||'').toLowerCase().includes(q));}
  f=[...f].sort((a,b)=>{const k=detSort.k;let va=a[k],vb=b[k];if(k===1){va=a[C.ISO]+a[C.HOUR];vb=b[C.ISO]+b[C.HOUR];}if(va<vb)return-detSort.dir;if(va>vb)return detSort.dir;return 0;});
  document.getElementById('detCount').textContent=`${fmt(f.length)} appels affichés`+(detSearch?` (recherche : "${detSearch}")`:'');
  const cellNum=num=>{const n=nameOf(num);return n
    ?`<span title="${escH(num)}">${escH(n)}</span>`
    :`<span style="font-family:'IBM Plex Mono',monospace">${escH(num)}</span>`;};
  const rows=f.slice(0,600).map(r=>`<tr>
    <td>${r[C.ISO].split('-').reverse().join('/')}</td><td style="font-family:'IBM Plex Mono',monospace">${String(r[C.HOUR]).padStart(2,'0')}h</td>
    <td>${cellNum(r[C.CALLER])}</td><td>${cellNum(r[C.CALLED])}</td>
    <td><span class="tag ${r[C.NAT]?'s':'e'}">${r[C.NAT]?'Sortant':'Entrant'}</span></td><td>${r[C.SITE]}</td>
    <td class="num">${mmss(r[C.DUR])}</td><td><span class="tag ${r[C.OK]?'ok':'no'}">${r[C.OK]?'Oui':'Non'}</span></td></tr>`).join('');
  document.getElementById('detBody').innerHTML=rows+(f.length>600?`<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:14px">… ${fmt(f.length-600)} lignes supplémentaires (affiner les filtres pour les voir)</td></tr>`:'');
}

// ---------- RÉUSSITE DES APPELS ----------
function tauxColor(t){if(t>=95)return'#E6F4EA';if(t>=90)return'#F4F6F9';if(t>=85)return'#FFF8EC';return'#FCE8E6';}
function tauxInk(t){if(t>=95)return'#137333';if(t>=90)return'#5a6470';if(t>=85)return'#9a6212';return'#a50e0e';}
function renderRate(){
  const f=filtered();
  const hours=[...new Set(f.map(r=>r[C.HOUR]))].sort((a,b)=>a-b);
  const rowsH=hours.map(h=>{const hf=f.filter(r=>r[C.HOUR]===h);const ok=hf.filter(r=>r[C.OK]).length;const tot=hf.length;return{lab:String(h).padStart(2,'0')+' h',ok,ko:tot-ok,tot,taux:tot?Math.round(ok/tot*1000)/10:0};});
  const totOk=f.filter(r=>r[C.OK]).length, totN=f.length, totKo=totN-totOk;
  // plages
  const plages=[['Matin (avant 12 h)',r=>r<12],['Midi (12 h – 14 h)',r=>r>=12&&r<14],['Après-midi (14 h – 18 h)',r=>r>=14&&r<18],['Soir (18 h et +)',r=>r>=18]];
  const rowsP=plages.map(([lab,fn])=>{const pf=f.filter(r=>fn(r[C.HOUR]));const ok=pf.filter(r=>r[C.OK]).length;const tot=pf.length;return{lab,ok,ko:tot-ok,tot,taux:tot?Math.round(ok/tot*1000)/10:0};}).filter(r=>r.tot>0);
  // pire créneau
  const worst=[...rowsH].filter(r=>r.tot>=10).sort((a,b)=>a.taux-b.taux)[0];
  document.getElementById('p-rate').innerHTML=`
   <div class="kpis">
     ${kpi('Appels',fmt(totN),'sur la sélection')}
     ${kpi('Réussis',fmt(totOk),pct(totOk,totN)+' du total','accentE')}
     ${kpi('Ratés',fmt(totKo),pct(totKo,totN)+' du total','accentA')}
     ${kpi('Taux de réussite',pct(totOk,totN))}
     ${kpi('Pire créneau',worst?worst.lab:'–',worst?worst.taux+' % de réussite':'')}
   </div>
   <div class="card" style="margin-bottom:16px"><h3>Réussis vs ratés par heure</h3><p class="hint">Empilement par tranche horaire — réagit aux filtres Site / Sens / Période</p><div class="cw"><canvas id="cRateBar"></canvas></div></div>
   <div class="grid g2">
     <div class="card"><h3>Détail par tranche horaire</h3><p class="hint">Couleur = taux de réussite (vert ≥ 95 %, ambre 85–90 %, rouge < 85 %)</p>
       <div class="scrollT" style="max-height:430px"><table>
         <thead><tr><th>Tranche</th><th class="num">Réussis</th><th class="num">Ratés</th><th class="num">Total</th><th class="num">Taux</th></tr></thead>
         <tbody>${rowsH.map(r=>`<tr><td class="bd">${r.lab}</td><td class="num">${r.ok}</td><td class="num">${r.ko}</td><td class="num">${r.tot}</td><td class="num" style="background:${tauxColor(r.taux)};color:${tauxInk(r.taux)};font-weight:600">${r.taux} %</td></tr>`).join('')}
         <tr class="tot" style="border-top:2px solid var(--ink)"><td><b>Total</b></td><td class="num"><b>${fmt(totOk)}</b></td><td class="num"><b>${fmt(totKo)}</b></td><td class="num"><b>${fmt(totN)}</b></td><td class="num"><b>${pct(totOk,totN)}</b></td></tr>
         </tbody></table></div></div>
     <div class="card"><h3>Synthèse par plage horaire</h3><p class="hint">Regroupement matin / midi / après-midi / soir</p>
       <div class="scrollT" style="max-height:430px"><table>
         <thead><tr><th>Plage</th><th class="num">Réussis</th><th class="num">Ratés</th><th class="num">Total</th><th class="num">Taux</th></tr></thead>
         <tbody>${rowsP.map(r=>`<tr><td class="bd">${r.lab}</td><td class="num">${r.ok}</td><td class="num">${r.ko}</td><td class="num">${r.tot}</td><td class="num" style="background:${tauxColor(r.taux)};color:${tauxInk(r.taux)};font-weight:600">${r.taux} %</td></tr>`).join('')}</tbody></table></div>
       <div class="note" style="margin-top:14px"><b>Note :</b> « raté » est un proxy (durée = 0 s) en l'absence du statut d'appel Keyyo. Il regroupe appels manqués, raccrochés immédiats, échecs réseau et messagerie. À lire comme une tendance.</div>
     </div>
   </div>`;
  newChart('cRateBar',{type:'bar',data:{labels:rowsH.map(r=>r.lab),datasets:[
    {label:'Réussis',data:rowsH.map(r=>r.ok),backgroundColor:COL.good},
    {label:'Ratés',data:rowsH.map(r=>r.ko),backgroundColor:COL.alert}]},
    options:{maintainAspectRatio:false,scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:COL.grid}}},plugins:{legend:{position:'bottom'}}}});
}

// ---------- ROUTER ----------
const TITLES={exec:'Vue Exécutive',vol:'Analyse des Volumes',time:'Analyse Temporelle',site:'Analyse des Sites',corr:'Analyse des Correspondants',dur:'Analyse des Durées',rate:'Réussite des Appels',det:'Détail des Appels'};
const RENDER={exec:renderExec,vol:renderVol,time:renderTime,site:renderSite,corr:renderCorr,dur:renderDur,rate:renderRate,det:renderDet};
function render(){RENDER[state.page]();}
function go(p){state.page=p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));document.getElementById('ptitle').textContent=TITLES[p];render();}

// init filters
function initFilters(){
  const fm=document.getElementById('fMonth');fm.innerHTML='<option value="all">Toute la période</option>'+M.ym.map(m=>`<option value="${m}">${mlabel(m)}</option>`).join('');
  const fs=document.getElementById('fSite');fs.innerHTML='<option value="all">Tous</option>'+M.sites.map(s=>`<option value="${s}">${s}</option>`).join('');
  fm.onchange=e=>{state.month=e.target.value;render();};
  fs.onchange=e=>{state.site=e.target.value;render();};
  document.getElementById('fNat').onchange=e=>{state.nat=e.target.value;render();};
  document.getElementById('reset').onclick=()=>{state.month='all';state.site='all';state.nat='all';fm.value='all';fs.value='all';document.getElementById('fNat').value='all';render();};
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.p);});
/* boot gere par la couche live */


// =================== COUCHE LIVE (Vercel serverless /api/data) ===================
const API_URL = '/api/data';
const CLIENT_POLL_MS = 60000;
let __firstLoad = true, __lastUpdatedAt = null, __pollTimer = null;

function fmtTime(d){ try{ return new Date(d).toLocaleTimeString('fr-FR'); }catch(e){ return '—'; } }
function setLive(kind, updatedAt, warning){
  const b=document.getElementById('liveBadge'), t=document.getElementById('liveText'); if(!b) return;
  b.className='live '+kind;
  if(kind==='ok'){ t.innerHTML='Live · maj <b>'+fmtTime(updatedAt)+'</b>'; b.title=warning?('Avertissement: '+warning):'Connecté à Keyyo'; }
  else if(kind==='warn'){ t.innerHTML='Live · 0 appel · maj <b>'+fmtTime(updatedAt)+'</b>'; b.title=warning||'Connecté mais aucune donnée'; }
  else if(kind==='err'){ t.innerHTML='Hors-ligne · maj '+(updatedAt?fmtTime(updatedAt):'—'); b.title=warning||'Erreur'; }
  else { t.textContent='Connexion…'; b.title=''; }
}
function showOverlay(title,msg,isErr){ const o=document.getElementById('overlay');
  document.getElementById('ovTitle').textContent=title; document.getElementById('ovMsg').textContent=msg;
  document.getElementById('ovRetry').style.display=isErr?'inline-block':'none'; o.className=isErr?'err':''; o.style.display='flex'; }
function hideOverlay(){ document.getElementById('overlay').style.display='none'; }
function toast(msg){ const el=document.getElementById('toast'); if(!el) return; el.textContent=msg; el.style.display='block';
  clearTimeout(el.__t); el.__t=setTimeout(()=>el.style.display='none',6000); }

function rebuildFilters(){
  const fm=document.getElementById('fMonth');
  if(fm){ fm.innerHTML='<option value="all">Toute la période</option>'+M.ym.map(m=>`<option value="${m}">${mlabel(m)}</option>`).join('');
    if(![...fm.options].some(o=>o.value===state.month)) state.month='all'; fm.value=state.month; }
  const fs=document.getElementById('fSite');
  if(fs){ fs.innerHTML='<option value="all">Tous</option>'+M.sites.map(s=>`<option value="${s}">${s}</option>`).join('');
    if(![...fs.options].some(o=>o.value===state.site)) state.site='all'; fs.value=state.site; }
}
function updateScope(){ const el=document.getElementById('scope'); if(!el||!M.n) return;
  el.innerHTML=`<b>Périmètre</b><br>${fmt(M.n)} appels · ${M.sites.length} sites<br>${M.min.split('-').reverse().join('/')} → ${M.max.split('-').reverse().join('/')}<br>${M.days} jours d'activité<br><span style="color:#5a6678">Statut « abouti » approximé via la durée &gt; 0.</span>`; }

function showEmptyNote(p){
  const host=document.getElementById('p-exec'); if(!host) return;
  const d=p.diag||{};
  const why=p.warning||'Aucun appel renvoyé par l’API.';
  host.innerHTML=`<div class="empty-note">
    <b>Connecté à Keyyo, mais 0 appel exploitable.</b><br>
    ${why}<br><br>
    Vu côté API : <b>${(d.rawSeen??0)}</b> enregistrement(s) brut(s) · <b>${(d.kept??0)}</b> gardé(s) · <b>${(d.dropped??0)}</b> écarté(s).<br>
    Étape suivante : ouvrir <code>/api/debug</code> pour voir la réponse brute de Keyyo (CSI, filtres, noms de champs).
  </div>`;
}
function applyData(p){
  R=p.rows||[]; M=p.meta||{}; __lastUpdatedAt=p.updatedAt||new Date().toISOString();
  const empty = R.length===0;
  if(__firstLoad){ __firstLoad=false;
    if(empty){ go('exec'); showEmptyNote(p); }
    else { updateScope(); initFilters(); go('exec'); }
  } else {
    if(empty){ showEmptyNote(p); }
    else { updateScope(); rebuildFilters(); render(); }
  }
  if(empty){ setLive('warn', __lastUpdatedAt, p.warning||'0 appel'); toast('0 appel renvoyé — voir le diagnostic affiché.'); }
  else { setLive('ok', __lastUpdatedAt, p.warning); if(p.warning) toast('Données partielles : '+p.warning); }
}

async function loadData(){
  try{
    const r=await fetch(API_URL);                 // URL stable -> profite du cache CDN
    if(!r.ok){ let j={}; try{ j=await r.json(); }catch(e){} throw new Error(j.error||('HTTP '+r.status)); }
    hideOverlay(); applyData(await r.json());
  }catch(e){
    if(__firstLoad){ showOverlay('Connexion impossible', e.message, true); }
    else { setLive('err', __lastUpdatedAt, e.message); toast('Actualisation échouée : '+e.message); }
  }
}
async function forceRefresh(){
  const btn=document.getElementById('btnRefresh'); if(btn){ btn.disabled=true; btn.textContent='…'; }
  setLive('load');
  try{
    const r=await fetch(API_URL+'?force=1&_='+Date.now(),{cache:'no-store'});  // bypass CDN
    if(!r.ok){ let j={}; try{ j=await r.json(); }catch(e){} throw new Error(j.error||('HTTP '+r.status)); }
    hideOverlay(); applyData(await r.json());
  }catch(e){ setLive('err', __lastUpdatedAt, e.message); toast('Actualisation échouée : '+e.message); }
  if(btn){ btn.disabled=false; btn.textContent='⟳'; }
}

document.getElementById('btnRefresh').addEventListener('click', forceRefresh);
document.getElementById('ovRetry').addEventListener('click', ()=>{ showOverlay('Connexion à Keyyo…','Nouvelle tentative…',false); loadData(); });
function startPolling(){ if(__pollTimer) return; __pollTimer=setInterval(loadData, CLIENT_POLL_MS); }
function stopPolling(){ clearInterval(__pollTimer); __pollTimer=null; }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ stopPolling(); } else { startPolling(); loadData(); } });

(async()=>{ await loadContacts(); loadData(); startPolling(); })();

</script>
