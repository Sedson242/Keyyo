<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Supervision des appels Keyyo — volumes, appels manqués, correspondants et activité par collaborateur sur les trois derniers mois.">
<meta name="robots" content="noindex, nofollow">
<title>Supervision des appels — Keyyo</title>

<link rel="preload" href="assets/css/tokens.css" as="style">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="modulepreload" href="app/main.js">
</head>
<body class="is-gated">

<!-- =========================================================================
     Bibliotheque d'icones. Un seul jeu de traces, reference par <use>.
     Toutes en 24x24, trait de 2, extremites arrondies.
     ========================================================================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-base" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>
  <symbol id="i-monitoring" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h4l2.5-7 4 14L16 12h5"/>
  </symbol>
  <symbol id="i-calls" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>
  </symbol>
  <symbol id="i-missed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 3l-6 6m0-6l6 6"/>
    <path d="M14.5 15.5l-1.6 1.6a13 13 0 0 1-6-6L8.5 9.5 6.8 5.4a1 1 0 0 0-1.1-.6l-2.6.5a1 1 0 0 0-.8 1.1A17.6 17.6 0 0 0 17.6 21.7a1 1 0 0 0 1.1-.8l.5-2.6a1 1 0 0 0-.6-1.1z"/>
  </symbol>
  <symbol id="i-peers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/>
    <circle cx="9" cy="7" r="3.4"/>
    <path d="M22 20v-1.5a4 4 0 0 0-3-3.87M16.5 3.6a4 4 0 0 1 0 6.8"/>
  </symbol>
  <symbol id="i-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/>
    <circle cx="8.5" cy="7" r="3.4"/>
    <path d="M16.5 11.5l2 2 4-4"/>
  </symbol>
  <symbol id="i-lines" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.5 16.5l-1.6 1.6a13 13 0 0 1-8-8L7.5 8.5 5.8 4.4a1 1 0 0 0-1.1-.6l-2.6.5a1 1 0 0 0-.8 1.1A18.6 18.6 0 0 0 18.6 22.7a1 1 0 0 0 1.1-.8l.5-2.6a1 1 0 0 0-.6-1.1z"/>
    <path d="M15 3h6v6"/>
  </symbol>
  <symbol id="i-diagnostics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5a9.5 9.5 0 1 0 9.5 9.5"/>
    <path d="M12 12l5-5"/>
    <circle cx="12" cy="12" r="1.6"/>
  </symbol>
  <symbol id="i-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 3l-7 7m0-5.5V10h5.5"/>
    <path d="M15.5 16.5l-1.6 1.6a13 13 0 0 1-8-8L7.5 8.5 5.8 4.4a1 1 0 0 0-1.1-.6l-2.6.5a1 1 0 0 0-.8 1.1A18.6 18.6 0 0 0 18.6 22.7a1 1 0 0 0 1.1-.8l.5-2.6a1 1 0 0 0-.6-1.1z"/>
  </symbol>
  <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 10l7-7m-5.5 0H21v5.5"/>
    <path d="M15.5 16.5l-1.6 1.6a13 13 0 0 1-8-8L7.5 8.5 5.8 4.4a1 1 0 0 0-1.1-.6l-2.6.5a1 1 0 0 0-.8 1.1A18.6 18.6 0 0 0 18.6 22.7a1 1 0 0 0 1.1-.8l.5-2.6a1 1 0 0 0-.6-1.1z"/>
  </symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.5 16.5l-1.6 1.6a13 13 0 0 1-8-8L7.5 8.5 5.8 4.4a1 1 0 0 0-1.1-.6l-2.6.5a1 1 0 0 0-.8 1.1A18.6 18.6 0 0 0 18.6 22.7a1 1 0 0 0 1.1-.8l.5-2.6a1 1 0 0 0-.6-1.1z"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.5 2"/>
  </symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5"/>
    <path d="M13.7 20a2 2 0 0 1-3.4 0"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5"/><path d="M4 20h16"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M21 4v4.5h-4.5"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9.5l6 6 6-6"/>
  </symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 6h17M3.5 12h17M3.5 18h17"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l9.5 16.5H2.5z"/><path d="M12 9.5v4.5M12 17h.01"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5l5 5 10-11"/>
  </symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 7l9 6 9-6"/>
  </symbol>
  <symbol id="i-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M8.5 15h7"/>
  </symbol>
</svg>

<!-- =========================================================================
     Ecran de connexion. Affiche tant que /api/auth?action=me n'a pas repondu
     « connecte » : c'est app/main.js qui le remplit et le retire. Le bouton
     est un LIEN, pas un fetch : la connexion est une navigation vers
     Microsoft, jouee par le serveur.
     ========================================================================= -->
<div class="gate" id="gate">
  <div class="gate-card" role="dialog" aria-labelledby="gate-title" aria-describedby="gate-text">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg><use href="#i-phone"/></svg></div>
      <div>
        <span class="brand-name">Keyyo</span>
        <span class="brand-sub">Supervision</span>
      </div>
    </div>
    <h1 class="gate-title" id="gate-title">Connexion</h1>
    <p class="gate-text" id="gate-text">Vérification de la session…</p>
    <div class="gate-actions" id="gate-actions"></div>
    <p class="gate-foot" id="gate-foot"></p>
  </div>
</div>

<!-- La coquille nait masquee (body.is-gated, aria-hidden) : c'est app/main.js
     qui la revele une fois la session verifiee. Sans cela, un visiteur non
     connecte verrait la coquille clignoter avant l'ecran de connexion. -->
<div class="app" id="app" aria-hidden="true">

  <!-- =======================================================================
       Barre laterale
       ======================================================================= -->
  <aside class="side" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg><use href="#i-phone"/></svg></div>
      <div>
        <span class="brand-name">Keyyo</span>
        <span class="brand-sub">Supervision</span>
      </div>
    </div>

    <nav aria-label="Navigation principale">
      <div class="nav-group">
        <p class="nav-title" id="navgrp-activite">Activité</p>
        <ul aria-labelledby="navgrp-activite">
          <li>
            <button class="nav-item is-active" data-route="monitoring" aria-current="page">
              <svg aria-hidden="true"><use href="#i-monitoring"/></svg>Monitoring
            </button>
          </li>
          <li>
            <button class="nav-item" data-route="calls">
              <svg aria-hidden="true"><use href="#i-calls"/></svg>Journal des appels
            </button>
          </li>
          <li>
            <button class="nav-item" data-route="missed">
              <svg aria-hidden="true"><use href="#i-missed"/></svg>Appels manqués
              <span class="nav-badge" id="nav-badge-missed" hidden>0</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="nav-group">
        <p class="nav-title" id="navgrp-annuaire">Annuaire</p>
        <ul aria-labelledby="navgrp-annuaire">
          <li>
            <button class="nav-item" data-route="peers">
              <svg aria-hidden="true"><use href="#i-peers"/></svg>Correspondants
            </button>
          </li>
          <li>
            <button class="nav-item" data-route="people">
              <svg aria-hidden="true"><use href="#i-people"/></svg>Collaborateurs
            </button>
          </li>
          <li>
            <button class="nav-item" data-route="lines">
              <svg aria-hidden="true"><use href="#i-lines"/></svg>Lignes Keyyo
            </button>
          </li>
        </ul>
      </div>

      <div class="nav-group">
        <p class="nav-title" id="navgrp-systeme">Système</p>
        <ul aria-labelledby="navgrp-systeme">
          <li>
            <button class="nav-item" data-route="diagnostics">
              <svg aria-hidden="true"><use href="#i-diagnostics"/></svg>Diagnostic
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <div class="side-foot">
      <button class="switch" id="sw-sound" type="button" aria-pressed="false">
        <span class="switch-track" aria-hidden="true"></span>
        <span>Son sur appel manqué</span>
      </button>
      <button class="switch" id="sw-notif" type="button" aria-pressed="false">
        <span class="switch-track" aria-hidden="true"></span>
        <span>Notifications système</span>
      </button>
      <p class="faint" style="font: var(--t-micro)" id="store-status">Base : —</p>
    </div>
  </aside>

  <!-- =======================================================================
       Zone principale
       ======================================================================= -->
  <main class="main">
    <div class="topbar">
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
        <svg aria-hidden="true"><use href="#i-menu"/></svg>
      </button>

      <div class="topbar-title">
        <h1 class="page-title" id="page-title">Monitoring</h1>
        <p class="page-sub" id="page-sub">Activité téléphonique des trois derniers mois</p>
      </div>

      <div class="topbar-actions">
        <span class="live is-loading" id="live" title="État de la connexion à l'API Keyyo">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="live-text">Chargement…</span>
        </span>

        <button class="btn btn--icon" id="btn-refresh" type="button" aria-label="Rafraîchir les données" title="Rafraîchir maintenant">
          <svg aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>

        <div class="bell" style="position:relative">
          <button class="btn btn--icon" id="btn-bell" type="button" aria-label="Alertes d'appels manqués" aria-expanded="false" aria-controls="notif-popover">
            <svg aria-hidden="true"><use href="#i-bell"/></svg>
            <span class="bell-badge" id="bell-badge" hidden>0</span>
          </button>
          <div class="popover" id="notif-popover" role="dialog" aria-label="Alertes d'appels manqués" hidden>
            <div class="popover-head">
              <span>Appels manqués récents</span>
              <button class="btn btn--ghost btn--sm" id="btn-notif-clear" type="button">Tout marquer lu</button>
            </div>
            <div id="notif-list"></div>
          </div>
        </div>

        <div class="account" id="account">
          <span class="avatar avatar--sm" id="account-initials" aria-hidden="true">–</span>
          <span class="account-text">
            <span class="account-name" id="account-name">Connexion…</span>
            <span class="account-sub" id="account-sub"></span>
          </span>
          <a class="btn btn--ghost btn--sm" id="btn-logout" href="/api/auth?action=logout" title="Se déconnecter">Déconnexion</a>
        </div>
      </div>
    </div>

    <!-- Bandeau d'avertissement global (collecte partielle, base absente...) -->
    <div id="global-notice"></div>

    <!-- Barre de periode : masquee sur les vues qui n'en dependent pas -->
    <div class="periodbar" id="periodbar">
      <div class="segmented" role="group" aria-label="Période">
        <button type="button" data-preset="7">7 jours</button>
        <button type="button" data-preset="30">30 jours</button>
        <button type="button" data-preset="92" class="is-active">3 mois</button>
        <button type="button" data-preset="all">Tout</button>
      </div>

      <div class="periodbar-range">
        <label for="date-from" class="sr-only">Date de début</label>
        <input type="date" id="date-from">
        <span aria-hidden="true">→</span>
        <label for="date-to" class="sr-only">Date de fin</label>
        <input type="date" id="date-to">
      </div>

      <div class="select-pill">
        <label for="filter-line" class="sr-only">Ligne</label>
        <select id="filter-line"><option value="">Toutes les lignes</option></select>
        <svg aria-hidden="true" style="width:13px;height:13px"><use href="#i-chevron"/></svg>
      </div>

      <div class="select-pill">
        <label for="filter-dir" class="sr-only">Sens</label>
        <select id="filter-dir">
          <option value="">Entrants et sortants</option>
          <option value="in">Entrants seulement</option>
          <option value="out">Sortants seulement</option>
          <option value="missed">Manqués seulement</option>
        </select>
        <svg aria-hidden="true" style="width:13px;height:13px"><use href="#i-chevron"/></svg>
      </div>

      <span class="toolbar-spacer"></span>
      <span class="periodbar-info" id="period-info"></span>
    </div>

    <!-- Vues. Une seule porte .is-active a la fois. -->
    <section class="page is-active" data-page="monitoring" id="page-monitoring" aria-labelledby="page-title"></section>
    <section class="page" data-page="calls" id="page-calls" aria-labelledby="page-title"></section>
    <section class="page" data-page="missed" id="page-missed" aria-labelledby="page-title"></section>
    <section class="page" data-page="peers" id="page-peers" aria-labelledby="page-title"></section>
    <section class="page" data-page="people" id="page-people" aria-labelledby="page-title"></section>
    <section class="page" data-page="lines" id="page-lines" aria-labelledby="page-title"></section>
    <section class="page" data-page="diagnostics" id="page-diagnostics" aria-labelledby="page-title"></section>
  </main>
</div>

<!-- Voile de la barre laterale en mobile -->
<div class="scrim" id="nav-scrim" hidden></div>

<!-- Fiche correspondant -->
<div class="modal-scrim" id="modal-scrim" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal" id="modal-body">
    <div class="modal-head">
      <span class="avatar avatar--lg" id="modal-avatar" aria-hidden="true">?</span>
      <div class="grow">
        <h2 class="modal-title" id="modal-title">Correspondant</h2>
        <p class="modal-sub" id="modal-sub"></p>
      </div>
      <button class="btn btn--icon modal-close" id="modal-close" type="button" aria-label="Fermer">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Messages ephemeres -->
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<!-- Repli si les modules ES ne se chargent pas -->
<noscript>
  <div class="notice notice--error" style="margin:20px">
    <svg><use href="#i-alert"/></svg>
    <div><span class="notice-title">JavaScript est requis.</span> Cette console lit l'API Keyyo dans le navigateur ; sans JavaScript, aucune donnée ne peut être affichée.</div>
  </div>
</noscript>

<script type="module" src="app/main.js"></script>
</body>
</html>
